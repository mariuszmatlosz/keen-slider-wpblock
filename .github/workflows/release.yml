name: Release

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  package:
    name: Build release package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Build plugin package
        run: pnpm run package

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: keen-slider-wpblock
          path: release/keen-slider-wpblock.zip
          if-no-files-found: error

      - name: Read plugin version
        id: plugin_version
        if: github.event_name != 'pull_request'
        run: |
          version="$(sed -n 's/^ \* Version:[[:space:]]*//p' plugin.php | head -n 1 | tr -d '[:space:]')"
          if [ -z "$version" ]; then
            echo "Plugin version header is missing"
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Publish the GitHub release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.plugin_version.outputs.value }}
          target_commitish: ${{ github.sha }}
          files: release/keen-slider-wpblock.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
